# Continue MCP configuration template — format reference.
#
# This is the configuration format produced by scripts/render_config.py for
# the Continue client. In normal use, generate a config rather than
# hand-editing one:
#
#   python3 scripts/render_config.py --profile <profile> --client continue \
#       --output {TARGET_REPOSITORY}/{MCP_CONFIG_DIR}/cris-mcp-toolbelt.yaml
#
# Or use the workspace enablement script:
#
#   scripts/enable_for_workspace.sh {TARGET_REPOSITORY} <profile>
#
# Note: selected servers and profile intent are declarative governance. Runtime
# enforcement remains the responsibility of the MCP server and client.

mcpServers:
  filesystem-controlled:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "{WORKSPACE_ROOT}"
  sequential-thinking:
    command: npx
    args:
      - "-y"
      - "@modelcontextprotocol/server-sequential-thinking"

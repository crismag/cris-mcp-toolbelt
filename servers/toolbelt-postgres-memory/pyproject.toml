[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbelt-postgres-memory"
version = "0.0.1"
description = "PostgreSQL-backed memory and audit MCP server for cris-mcp-toolbelt."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
toolbelt-postgres-memory = "toolbelt_postgres_memory.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolbelt_postgres_memory = ["schemas/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

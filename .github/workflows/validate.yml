name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema pytest mcp

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Validate profiles
        run: python3 scripts/validate_profiles.py

      - name: Policy lint
        run: python3 scripts/policy_lint.py

      - name: Check documentation links
        run: python3 scripts/check_docs_links.py

      - name: Render config dry-runs
        run: |
          python3 scripts/render_config.py --profile readonly-research --client generic --dry-run
          python3 scripts/render_config.py --profile local-dev --client continue --workspace-root "$PWD" --dry-run
          python3 scripts/render_config.py --profile executor --client continue --workspace-root "$PWD" --dry-run

      - name: Doctor
        run: bash scripts/doctor.sh

      - name: MCP server smoke checks
        run: bash scripts/test_mcp_servers.sh

      - name: Shell syntax check
        run: |
          for s in scripts/*.sh; do
            bash -n "$s"
          done

      - name: Python syntax check
        run: |
          for p in scripts/*.py; do
            python3 -m py_compile "$p"
          done

      - name: Run test suite
        run: python3 -m pytest tests/ -q

      - name: Run command runner tests
        run: |
          cd servers/command-runner-controlled
          python3 -m pytest tests/ -q

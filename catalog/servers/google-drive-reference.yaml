id: google-drive-reference
name: Google Drive Reference MCP
description: >-
  Archived MCP reference Google Drive server for Drive file access. It is
  cataloged as historical and requires OAuth or Google credentials to use.
category: productivity
provider: Model Context Protocol
homepage: https://modelcontextprotocol.io
source_url: https://github.com/modelcontextprotocol/servers-archived
license: MIT
transport: stdio
auth_required: true
runtime: null
capability_class: modifying
capabilities:
  - drive_file_search
  - drive_file_read
  - drive_file_write
  - document_access
controlled_capabilities:
  - drive_file_write
  - private_document_access
  - oauth_token_misuse
  - data_exfiltration
default_access: disabled
allowed_profiles:
  - readonly-research
  - writer
activation_policy:
  default_state: disabled
  allowed_profiles:
    - readonly-research
    - writer
  requires_confirmation: true
  requires_allowlist: true
  requires_scope_limit: true
  audit_required: true
scope_controls:
  drive_policy:
    oauth_scope_minimization_required: true
    folder_allowlist_required: true
    write_disabled_by_default: true
data_exposure:
  - google_drive_files
  - document_content
  - account_metadata
trust_level: unknown
review_status: proposed
security_notes:
  threats:
    - Exfiltration of private Drive documents
    - OAuth token misuse or overly broad Google scopes
    - Upstream source is archived and unmaintained
  mitigations:
    - Runtime left null pending maintained replacement or local validation
    - Use read-only OAuth scopes and folder allowlists
    - Require writer activation and audit for file mutation
tags:
  - google-drive
  - productivity
  - archived-reference


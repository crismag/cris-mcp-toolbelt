id: filesystem-controlled
name: Filesystem Controlled MCP
description: >-
  Lets AI agents inspect and optionally modify project files under intentional
  workspace scope controls. Read and inspect modes are conservative defaults;
  file write and patch application are activated through a profile.
category: local-development
provider: Model Context Protocol
homepage: https://modelcontextprotocol.io
source_url: https://github.com/modelcontextprotocol/servers
license: MIT
transport: stdio
auth_required: false
capability_class: modifying
capabilities:
  - filesystem_read
  - workspace_inspection
  - file_context_generation
  - filesystem_write
  - file_patch_application
controlled_capabilities:
  - filesystem_write
  - bulk_file_modification
  - private_file_access
default_access: inspect
allowed_profiles:
  - local-inspect
  - local-dev
  - writer
activation_policy:
  default_state: inspect_only
  allowed_profiles:
    - local-inspect
    - local-dev
    - writer
  requires_confirmation: true
  requires_allowlist: false
  requires_scope_limit: true
  audit_required: true
scope_controls:
  workspace_required: true
  path_restrictions:
    - "{WORKSPACE_ROOT}"
  blocked_paths:
    - "{USER_HOME}/.ssh"
    - "{USER_HOME}/.config"
    - "{USER_HOME}/.aws"
    - "**/.env"
    - "**/*secret*"
    - "**/*token*"
data_exposure:
  - source_files
  - configuration_files
  - documentation
trust_level: experimental
review_status: proposed
security_notes:
  threats:
    - Reading sensitive files such as credentials or environment files
    - Unintended or bulk file modification outside the intended scope
  mitigations:
    - Inspect-only default with profile-gated write activation
    - Workspace path restrictions and blocked sensitive paths
    - Confirmation and audit required for write activation
tags:
  - filesystem
  - local-development
  - workspace
